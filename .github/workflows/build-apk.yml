name: Build Flet APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java (Necessário para o Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar APK com Flet
        run: |
          # Adicionamos a flag --yes para o Flet não travar pedindo confirmação no terminal
          flet build apk src/main.py --yes

      - name: Salvar o APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-android-release
          path: build/apk/app-release.apk